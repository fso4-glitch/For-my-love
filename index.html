<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Para Você ❤️</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- CORAÇÕES -->
  <div class="hearts"></div>

  <!-- TELA 1 -->
  <section class="screen active" id="screen1">

    <div class="glass intro-card">

      <div class="heart-icon">♡</div>

      <h1>
        tem algumas coisas que eu
        nunca consegui te explicar
        direito...
      </h1>

      <button id="startBtn">
        descobrir ✨
      </button>

    </div>

  </section>

  <!-- TELA 2 -->
  <section class="screen" id="screen2">

    <h1 class="title">
      toque nas estrelas 💗
    </h1>

    <div class="stars-container">

      <div class="star" data-id="1"
      data-text="você virou a parte mais leve dos meus dias ✨">
        ☆
      </div>

      <div class="star" data-id="2"
      data-text="você me faz sorrir mesmo nos dias ruins 💜">
        ☆
      </div>

      <div class="star" data-id="3"
      data-text="eu comecei a imaginar um futuro bonito com você ❤️">
        ☆
      </div>

      <div class="star special" id="specialStar">
        ☆
      </div>

    </div>

    <!-- MODAL -->
    <div class="modal hidden" id="modal">

      <div class="glass modal-card">

        <button class="close" id="closeBtn">
          ×
        </button>

        <div class="star-number" id="starNumber">
          1
        </div>

        <p id="modalText"></p>

        <button class="pink-btn" id="closeModal">
          fechar
        </button>

      </div>

    </div>

  </section>

  <!-- PEDIDO -->
  <section class="screen" id="screen3">

    <div class="glass proposal-card">

      <div class="heart-icon">♡</div>

      <h2>
        e foi aí que eu percebi...
      </h2>

      <p class="proposal-text">
        que eu não queria sentir tudo isso sozinho ❤️
      </p>

      <h1 class="proposal-title">
        Quer namorar comigo?
      </h1>

      <div class="buttons">

        <button class="yes-btn" id="yesBtn">
          SIM 💗
        </button>

        <button class="no-btn" id="noBtn">
          NÃO 🥺
        </button>

      </div>

      <div id="noMessage"></div>

    </div>

  </section>

  <!-- FINAL -->
  <section class="screen" id="screen4">

    <div class="glass final-card">

      <div class="heart-icon">♡</div>

      <h1>
        você disse sim 💜
      </h1>

      <p>
        agora oficialmente você é
        a melhor parte da minha vida ✨
      </p>

      <audio controls autoplay loop>
        <source src="musica.mp3" type="audio/mp3">
      </audio>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
