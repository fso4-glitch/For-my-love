<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para Você ❤️</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- FUNDO -->
  <div class="background"></div>

  <!-- PARTÍCULAS -->
  <div class="particles"></div>

  <!-- TELA 1 -->
  <section id="inicio" class="screen active">

    <div class="glass">

      <h1 class="typing">
        tem algumas coisas que eu nunca consegui te explicar direito...
      </h1>

      <button id="startBtn">
        descobrir ✨
      </button>

    </div>

  </section>

  <!-- TELA 2 -->
  <section id="universo" class="screen">

    <h1 class="title">
      toque nas estrelas ❤️
    </h1>

    <div class="stars-container">

      <div class="star" data-text="você virou a parte mais leve dos meus dias ✨">
        ⭐
      </div>

      <div class="star" data-text="você me faz sorrir mesmo nos dias ruins 💜">
        ⭐
      </div>

      <div class="star" data-text="eu comecei a imaginar um futuro bonito com você ❤️">
        ⭐
      </div>

      <div class="star special" id="specialStar">
        ⭐
      </div>

    </div>

    <!-- CARTA -->
    <div id="messageBox" class="glass hidden">

      <p id="messageText"></p>

      <button id="closeBtn">
        fechar
      </button>

    </div>

  </section>

  <!-- TELA FINAL -->
  <section id="finalScreen" class="screen">

    <div class="glass final-card">

      <h1>
        e foi aí que eu percebi...
      </h1>

      <p>
        que eu não queria sentir tudo isso sozinho ❤️
      </p>

      <h2>
        Quer namorar comigo?
      </h2>

      <div class="buttons">

        <button id="yesBtn">
          SIM 💗
        </button>

        <button id="noBtn">
          NÃO 🥺
        </button>

      </div>

      <p id="noText"></p>

    </div>

  </section>

  <!-- TELA SIM -->
  <section id="yesScreen" class="screen">

    <div class="glass final-love">

      <h1>
        você disse sim 💜
      </h1>

      <p>
        agora oficialmente você é a melhor parte da minha vida ✨
      </p>

      <audio controls autoplay loop>
        <source src="musica.mp3" type="audio/mp3">
      </audio>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
